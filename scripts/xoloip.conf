[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=91.108.104.221

[global]
type=global
user_agent=sipsak 0.9.8.1

[xolo-auth]
type=auth
auth_type=userpass
username=8138073157
password=J422x6p!

[xolo-aor]
