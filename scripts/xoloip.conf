; XoloIP — full IP-auth (no GSIP, no user/pass)
; Place at /etc/asterisk/pjsip.d/xoloip.conf
;
; INBOUND:  Xolo DID → 91.108.104.221:5060 (match source IP) → from-trunk
; OUTBOUND: Dial(PJSIP/BUYER@xolo-endpoint) → 45.79.4.41 (IP trusted from 91.108.104.221)
;
; Xolo: whitelist 91.108.104.221 — no SIP registration or password needed.
; All outbound (PSTN + TFN) → 45.79.4.41 only.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_signaling_address=91.108.104.221
external_media_address=91.108.104.221

[xolo-aor]
type=aor
contact=sip:45.79.4.41
max_contacts=1
qualify_frequency=0

[xolo-endpoint]
type=endpoint
context=from-trunk
disallow=all
allow=ulaw,alaw
aors=xolo-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
trust_id_inbound=yes
trust_id_outbound=yes
send_pai=yes
send_rpid=yes
allow_unauthenticated_options=yes
from_domain=91.108.104.221

; Inbound from Xolo gateway IPs (DID → server IP path)
[xolo-identify]
type=identify
endpoint=xolo-endpoint
match=147.182.140.18
match=45.79.4.41
