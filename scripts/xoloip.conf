; XoloIP / gsip trunk — place at /etc/asterisk/pjsip.d/xoloip.conf
; Include from pjsip.conf: #include "/etc/asterisk/pjsip.d/xoloip.conf"

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_signaling_address=91.108.104.221
external_media_address=91.108.104.221

[xolo-auth]
type=auth
auth_type=userpass
username=7905442903
password=A#Q9q#2)

[xolo-aor]
type=aor
contact=sip:gate157.gsip.xoloip.com
max_contacts=5

[xolo-endpoint]
type=endpoint
context=from-trunk
disallow=all
allow=ulaw,alaw
outbound_auth=xolo-auth
aors=xolo-aor
from_user=7905442903
from_domain=gate157.gsip.xoloip.com
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
outbound_proxy=sip:gate157.gsip.xoloip.com

[xolo-reg16]
type=registration
transport=transport-udp
outbound_auth=xolo-auth
server_uri=sip:gate157.gsip.xoloip.com
client_uri=sip:7905442903@gate157.gsip.xoloip.com
contact_user=7905442903
retry_interval=60
forbidden_retry_interval=300
auth_rejection_permanent=no
expiration=3600

[xolo-identify]
type=identify
endpoint=xolo-endpoint
match=147.182.140.18
